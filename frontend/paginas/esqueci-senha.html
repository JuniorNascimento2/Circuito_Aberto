<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esqueci minha senha — Circuito Aberto</title>
  <meta name="theme-color" content="#1a9e72" />

  <link rel="icon" type="image/x-icon" href="../recursos/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../recursos/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../recursos/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../recursos/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <script src="../js/sessao.js"></script>
  <script src="../js/protecao.js"></script>
  <script>somenteVisitante();</script>
  <script src="../js/captura-erros.js"></script>

  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <div id="navegacao-raiz"></div>
    <main style="flex:1;">

      <div class="auth-wrap page-enter">
        <div class="card auth-box">
          <div class="auth-logo-row">
            <img src="../recursos/logo.png" alt="Circuito Aberto" style="width:40px;height:40px;object-fit:contain;">
            <span class="auth-logo-text">Circuito Aberto</span>
          </div>

          <div id="esqueci-form-tela">
            <h1 class="auth-title">Esqueci minha senha</h1>
            <p class="auth-sub">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
            <form id="esqueci-form">
              <div class="form-group">
                <label class="form-label">E-mail</label>
                <input name="email" type="email" class="form-input" placeholder="seu@email.com" required>
              </div>
              <button type="submit" class="btn btn-primary" id="esqueci-enviar-btn" style="width:100%;justify-content:center;padding:10px;">
                <i class="ti ti-send"></i> Enviar link
              </button>
            </form>
            <p class="auth-switch">Lembrou a senha? <a href="entrar.html">Voltar ao login</a></p>
          </div>

          <div id="esqueci-enviado-tela" class="center-block hidden">
            <i class="ti ti-mail-check" style="font-size:48px;color:var(--green);margin-bottom:16px;display:block;"></i>
            <h2 class="auth-title">E-mail enviado!</h2>
            <p class="auth-sub">Verifique sua caixa de entrada e siga as instruções para redefinir sua senha.</p>
            <a href="entrar.html" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;margin-top:8px;">
              <i class="ti ti-arrow-left"></i> Voltar para o login
            </a>
          </div>
        </div>
      </div>


    </main>
    <div id="rodape-raiz"></div>
  </div>

  <script src="../js/utilitarios.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/aviso.js"></script>
  <script src="../js/confirmacao.js"></script>
  <script src="../js/cartao-projeto.js"></script>
  <script src="../js/barra-navegacao.js"></script>
  <script src="../js/rodape.js"></script>
  <script src="../js/paginas/esqueci-senha.js"></script>
  <script>
    iniciarBarraNavegacao();
    iniciarRodape();
    iniciarPaginaEsqueciSenha();
  </script>
</body>
</html>

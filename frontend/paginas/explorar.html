<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorar projetos — Circuito Aberto</title>
  <meta name="theme-color" content="#1a9e72" />

  <link rel="icon" type="image/x-icon" href="../recursos/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../recursos/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../recursos/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../recursos/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <script src="../js/sessao.js"></script>
  <script src="../js/protecao.js"></script>
  <script>exigirLogin();</script>
  <script src="../js/captura-erros.js"></script>

  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <div id="navegacao-raiz"></div>
    <main style="flex:1;">

      <div class="page-container page-enter">

        <!-- Barra de busca -->
        <div class="search-row">
          <form id="explorar-busca-form" class="feed-search-form">
            <i class="ti ti-search feed-search-icon"></i>
            <input id="explorar-busca-campo" class="feed-search-input" placeholder="Buscar projetos, componentes, materiais...">
            <button type="button" id="explorar-limpar-btn" class="feed-clear-btn hidden"><i class="ti ti-x"></i></button>
            <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
          </form>
          <select id="explorar-ordem-select" class="form-input feed-sort-select">
            <option value="recentes">🕐 Mais recentes</option>
            <option value="recomendados">✨ Recomendados</option>
            <option value="curtidas">❤️ Mais curtidos</option>
            <option value="copias">📋 Mais copiados</option>
          </select>
        </div>

        <!-- Filtros de plataforma -->
        <div class="filter-row" id="explorar-filtros">
          <button class="feed-chip feed-chip-active" data-plataforma="Todos">Todos</button>
          <button class="feed-chip" data-plataforma="Arduino Uno">Arduino Uno</button>
          <button class="feed-chip" data-plataforma="Arduino Mega">Arduino Mega</button>
          <button class="feed-chip" data-plataforma="Arduino Nano">Arduino Nano</button>
          <button class="feed-chip" data-plataforma="ESP32">ESP32</button>
          <button class="feed-chip" data-plataforma="ESP8266">ESP8266</button>
        </div>

        <!-- Contagem -->
        <p class="feed-count hidden" id="explorar-contagem"></p>

        <!-- Grade / carregando / vazio -->
        <div class="center-spinner" id="explorar-carregando"><div class="spinner" style="width:40px;height:40px;"></div></div>
        <div class="empty hidden" id="explorar-vazio">
          <i class="ti ti-mood-empty" id="explorar-vazio-icone"></i>
          <p id="explorar-vazio-texto">Nenhum projeto encontrado.</p>
          <button class="btn btn-outline btn-sm hidden" id="explorar-tentar-novamente-btn">Tentar novamente</button>
        </div>
        <div class="projects-grid hidden" id="explorar-grade"></div>

        <!-- Paginação -->
        <div class="pagination hidden" id="explorar-paginacao">
          <button class="btn btn-outline btn-sm" id="explorar-anterior-btn"><i class="ti ti-arrow-left"></i> Anterior</button>
          <div class="feed-page-numbers" id="explorar-numeros-pagina"></div>
          <button class="btn btn-outline btn-sm" id="explorar-proxima-btn">Próxima <i class="ti ti-arrow-right"></i></button>
        </div>

      </div>


    </main>
    <div id="rodape-raiz"></div>
  </div>

  <script src="../js/utilitarios.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/aviso.js"></script>
  <script src="../js/confirmacao.js"></script>
  <script src="../js/cartao-projeto.js"></script>
  <script src="../js/barra-navegacao.js"></script>
  <script src="../js/rodape.js"></script>
  <script src="../js/paginas/explorar.js"></script>
  <script>
    iniciarBarraNavegacao();
    iniciarRodape();
    iniciarPaginaExplorar();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Circuito Aberto</title>
  <meta name="theme-color" content="#1a9e72" />

  <link rel="icon" type="image/x-icon" href="../recursos/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../recursos/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../recursos/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../recursos/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <script src="../js/sessao.js"></script>
  <script src="../js/captura-erros.js"></script>

  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <div id="navegacao-raiz"></div>
    <main style="flex:1;">

      <div class="ep-page page-enter">
        <div class="ep-box">
          <div class="ep-emoji">🔌</div>
          <div class="ep-code">404</div>
          <h1 class="ep-title">Página não encontrada</h1>
          <p class="ep-desc">O circuito que você procura não existe ou foi removido.</p>
          <div class="ep-actions">
            <button class="btn btn-outline" id="erro-voltar-btn"><i class="ti ti-arrow-left"></i> Voltar</button>
            <a href="explorar.html" class="btn btn-primary"><i class="ti ti-home"></i> Ir para os projetos</a>
          </div>
          <div class="ep-circuit">
            <div class="ep-dot" style="animation-delay:0s;"></div>
            <div class="ep-dot" style="animation-delay:0.2s;"></div>
            <div class="ep-dot" style="animation-delay:0.4s;"></div>
            <div class="ep-dot" style="animation-delay:0.6s;"></div>
            <div class="ep-dot" style="animation-delay:0.8s;"></div>
          </div>
        </div>
      </div>


    </main>
    <div id="rodape-raiz"></div>
  </div>

  <script src="../js/utilitarios.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/aviso.js"></script>
  <script src="../js/confirmacao.js"></script>
  <script src="../js/cartao-projeto.js"></script>
  <script src="../js/barra-navegacao.js"></script>
  <script src="../js/rodape.js"></script>
  <script>
    iniciarBarraNavegacao();
    iniciarRodape();
    document.getElementById('erro-voltar-btn').addEventListener('click', () => {
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'explorar.html';
    });
  </script>
</body>
</html>

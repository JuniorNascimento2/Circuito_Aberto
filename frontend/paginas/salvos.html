  <link rel="icon" type="image/png" sizes="192x192" href="../recursos/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../recursos/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <script src="../js/sessao.js"></script>
  <script src="../js/protecao.js"></script>
  <script>exigirLogin();</script>

  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <div id="navegacao-raiz"></div>
    <main style="flex:1;">

      <div class="page-container page-enter">
        <div class="saved-header">
          <h1 class="saved-title"><i class="ti ti-bookmark"></i>Projetos salvos</h1>
          <p class="saved-sub" id="salvos-subtitulo">0 projetos salvos</p>
        </div>

        <div class="center-spinner" id="salvos-carregando"><div class="spinner" style="width:40px;height:40px;"></div></div>
        <div class="empty hidden" id="salvos-vazio">
          <i class="ti ti-bookmark-off"></i>
          <p>Você ainda não salvou nenhum projeto.</p>
          <a href="explorar.html" class="btn btn-primary" style="margin-top:16px;">
            <i class="ti ti-layout-grid"></i> Explorar projetos
          </a>
        </div>
        <div class="projects-grid hidden" id="salvos-grade"></div>
      </div>

    <div id="rodape-raiz"></div>
  </div>

  <script src="../js/utilitarios.js"></script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas estatísticas — Circuito Aberto</title>
  <meta name="theme-color" content="#1a9e72" />

  <link rel="icon" type="image/x-icon" href="../recursos/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../recursos/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../recursos/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../recursos/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <script src="../js/sessao.js"></script>
  <script src="../js/protecao.js"></script>
  <script>exigirLogin();</script>
  <script src="../js/captura-erros.js"></script>

  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <div id="navegacao-raiz"></div>
    <main style="flex:1;">

      <div class="center-spinner-lg" id="estatisticas-carregando"><div class="spinner" style="width:40px;height:40px;"></div></div>
      <div class="empty hidden" id="estatisticas-erro" style="padding:80px;">
        <i class="ti ti-chart-bar"></i><p>Não foi possível carregar as estatísticas.</p>
      </div>

      <div class="page-container page-enter hidden" id="estatisticas-raiz">
        <div class="stats-header">
          <h1 class="stats-title"><i class="ti ti-chart-bar"></i>Minhas estatísticas</h1>
          <p class="stats-sub">Acompanhe o desempenho dos seus projetos</p>
        </div>

        <div class="stats-grid" id="estatisticas-cartoes"></div>

        <div class="two-col">
          <div class="card stats-section" id="estatisticas-top-projetos"></div>
          <div class="card stats-section" id="estatisticas-por-plataforma"></div>
        </div>

        <div class="card stats-section hidden" id="estatisticas-atividade"></div>
      </div>


    </main>
    <div id="rodape-raiz"></div>
  </div>

  <script src="../js/utilitarios.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/aviso.js"></script>
  <script src="../js/confirmacao.js"></script>
  <script src="../js/cartao-projeto.js"></script>
  <script src="../js/barra-navegacao.js"></script>
  <script src="../js/rodape.js"></script>
  <script src="../js/paginas/estatisticas.js"></script>
  <script>
    iniciarBarraNavegacao();
    iniciarRodape();
    iniciarPaginaEstatisticas();
  </script>
</body>
</html>
